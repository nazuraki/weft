<!doctype html>
<!--
	`weft-scope` on the root, not on `<body>`: the theme blocks set `color-scheme`,
	and the ROOT element's used value is what drives viewport scrollbar rendering
	and the pre-paint canvas colour. On `<body>` you get a dark app with light
	scrollbars and a white flash before first paint.

	It is also what makes the standalone app resolve its tokens at all, now that
	they are declared on `.weft-scope` rather than globally.
-->
<html lang="en" class="weft-scope">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Weft</title>
		%sveltekit.head%
	</head>
	<script>
		const saved = localStorage.getItem("weft-theme");
		const sysPreferred = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
		const configDefault = document.querySelector('meta[name="weft-default-theme"]')?.content;
		document.documentElement.setAttribute("data-theme", saved ?? configDefault ?? sysPreferred);
	</script>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
