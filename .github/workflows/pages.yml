name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "packages/core/**"
      - "packages/embed/**"
      - "scripts/gen-manifest.mjs"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: latest

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @lepid-labs/weft-core
        run: pnpm --filter @lepid-labs/weft-core build

      - name: Sync SvelteKit (generates .svelte-kit/tsconfig.json for embed build)
        run: pnpm --filter @lepid-labs/weft-ui exec svelte-kit sync

      - name: Build @lepid-labs/weft-embed
        run: pnpm --filter @lepid-labs/weft-embed build

      - name: Generate manifest
        run: node scripts/gen-manifest.mjs

      - name: Assemble site
        run: |
          mkdir -p _site/docs
          # Static HTML pages
          cp site/index.html _site/index.html
          cp site/docs/index.html _site/docs/index.html
          # Embed bundle (referenced via ../ from docs/index.html)
          cp packages/embed/dist/weft.iife.js _site/weft.iife.js
          cp packages/embed/dist/weft.css _site/weft.css
          # Manifest lives at docs/.weft/ so baseUrl path docs/.weft/manifest.json resolves
          cp -r docs/.weft _site/docs/.weft
          # Markdown files: node IDs are relative to docsDir, so rawUrl('use-cases.md')
          # resolves to https://nazuraki.github.io/weft/use-cases.md — place at site root.
          # This flattening assumes bare node IDs, i.e. a single-docsDir config. A repo
          # using `projects` gets slug-namespaced IDs (alpha/use-cases.md) and would need
          # its docs copied under those prefixes instead.
          cp docs/*.md _site/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
