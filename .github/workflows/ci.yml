name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: latest

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: extractions/setup-just@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: just lint

      - name: Typecheck
        run: just typecheck

      # The embed bundle's own build step asserts it ships nothing that can
      # reach a host page. Run on PRs so a regression fails here rather than on
      # the next Pages deploy.
      - name: Build the embed bundle
        run: just build-embed

      - name: Test
        run: just test
